name: CI
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: TypeScript check and production build
        run: npm run build
      - name: Client and mock isolation tests (no live NASA calls)
        run: npm test
      - name: OpenAPI, fixture schemas and DTO compatibility
        run: npm run test:contracts
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore LunarNavigator.sln
      - run: dotnet build LunarNavigator.sln --configuration Release --no-restore
      - run: dotnet test LunarNavigator.sln --configuration Release --no-build
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Guard tracked files against secrets and oversized/raw data
        run: python scripts/check-repository.py
      - name: Whitespace errors
        run: git --no-pager show --format= --check HEAD
